user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"duration":$request_time,"upstream":"$upstream_addr"}';
  access_log /var/log/nginx/access.log json;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 10m;

  upstream api_backend {
    least_conn;
    server api1:5001 max_fails=3 fail_timeout=15s;
    server api2:5001 max_fails=3 fail_timeout=15s;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    location /api/ {
      proxy_pass http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 5s;
      proxy_send_timeout 60s;
      proxy_read_timeout 120s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }

    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
  }
}
