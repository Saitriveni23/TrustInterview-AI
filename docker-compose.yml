services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trustinterview
      POSTGRES_USER: trustinterview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustinterview -d trustinterview"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build: ./backend
    command: ["node", "scripts/migrate.js"]
    environment: &backend-env
      NODE_ENV: production
      DATABASE_URL: postgres://trustinterview:${POSTGRES_PASSWORD}@postgres:5432/trustinterview
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      RESUME_ENCRYPTION_KEY: ${RESUME_ENCRYPTION_KEY}
      FRONTEND_URL: ${PUBLIC_ORIGIN:-http://localhost}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: "no"

  seed:
    build: ./backend
    command: ["node", "scripts/seed.js"]
    environment: *backend-env
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: "no"

  api1:
    build: ./backend
    environment:
      <<: *backend-env
      INSTANCE_ID: api1
    depends_on:
      seed: { condition: service_completed_successfully }
    restart: unless-stopped

  api2:
    build: ./backend
    environment:
      <<: *backend-env
      INSTANCE_ID: api2
    depends_on:
      seed: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["node", "worker.js"]
    environment: *backend-env
    depends_on:
      seed: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_FIREBASE_API_KEY: ${REACT_APP_FIREBASE_API_KEY}
        REACT_APP_FIREBASE_AUTH_DOMAIN: ${REACT_APP_FIREBASE_AUTH_DOMAIN}
        REACT_APP_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
        REACT_APP_FIREBASE_APP_ID: ${REACT_APP_FIREBASE_APP_ID}
        REACT_APP_API_URL: ""
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      api1: { condition: service_healthy }
      api2: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
